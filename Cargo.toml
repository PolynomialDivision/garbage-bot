[package]
name = "garbage-bot"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "garbage-bot"
path = "src/main.rs"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
futures-util = "0.3"
mxbot-common = { git = "https://github.com/PolynomialDivision/mxbot-common" }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "cookies"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
url = "2"
